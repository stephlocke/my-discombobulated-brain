languageCode = 'en-GB'
title = 'My Discombobulated Brain'
# Enable emoji support
enableEmoji = true
# Enable Git info
enableGitInfo = false
# Enable RSS
enableRSS = true
# Enable robots.txt generation (see layouts/robots.txt)
enableRobotsTXT = true

[params.hugo]
  version = "0.160.1"
  extended = true

# Pagination
[pagination]
  pagerSize = 6

# Build configuration for Tailwind CSS
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
  [[module.mounts]]
    source = 'static/images'
    target = 'assets/images'

[taxonomies]
  category = 'categories'
  tag = 'tags'

# Every page that can appear in navigation is listed here, flat, with its
# identifier, URL, and display weight (display order). This structure is
# fixed in code and never CMS-editable. Whether each page actually appears —
# and whether it appears in the main list or inside the "More" dropdown — is
# controlled separately, by content editors, via data/nav.toml (see the
# "Navigation Labels" file in the CMS, and layouts/partials/essentials/nav-menu.html
# which combines the two).
[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    url = '/'
    pageRef = '/'
    weight = 1
  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    pageRef = '/about'
    weight = 2
  [[menu.main]]
    identifier = 'contact'
    name = 'Contact'
    url = '/contact/'
    weight = 3
  [[menu.main]]
    identifier = 'blog'
    name = 'Blog'
    url = '/blog/'
    pageRef = '/blog'
    weight = 4
  [[menu.main]]
    identifier = 'events'
    name = 'Events'
    url = '/events/'
    pageRef = '/events'
    weight = 5
  [[menu.main]]
    identifier = 'services'
    name = 'Services'
    url = '/services/'
    pageRef = '/services'
    weight = 6
  [[menu.main]]
    identifier = 'awards'
    name = 'Awards and Recognition'
    url = '/awards-and-recognition/'
    pageRef = '/awards-and-recognition'
    weight = 7
  [[menu.main]]
    identifier = 'worked-with'
    name = 'Worked With'
    url = '/worked-with/'
    pageRef = '/worked-with'
    weight = 8

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = true
    lineNumbersInTable = true
    noClasses = true
    style = 'monokai'
    tabWidth = 4

[outputs]
  home = ['HTML', 'RSS', 'JSON']
  page = ['HTML']
  section = ['HTML', 'RSS']

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

# Custom output format for generating the Sveltia CMS admin/config.yml at build time,
# so CMS-chrome fields (site_url, logout_redirect_url, logo, app_title) derive from this
# file instead of being hand-duplicated per site clone.
[mediaTypes."text/yaml"]
  suffixes = ["yml"]

[outputFormats.CMSConfig]
  mediaType = "text/yaml"
  isPlainText = true
  notAlternative = true
