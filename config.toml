baseURL = 'https://stephlocke.com/my-discombobulated-brain/'
languageCode = 'en-GB'
title = 'My Discombobulated Brain'
# Enable emoji support
enableEmoji = true
# Enable Git info
enableGitInfo = false
# Enable RSS
enableRSS = true
# Enable robots.txt generation (see layouts/robots.txt)
enableRobotsTXT = true

[params.hugo]
  version = "0.160.1"
  extended = true

# Pagination
[pagination]
  pagerSize = 5

# Build configuration for Tailwind CSS
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
  [[module.mounts]]
    source = 'static/images'
    target = 'assets/images'

[taxonomies]
  category = 'categories'
  tag = 'tags'

[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    url = '/'
    pageRef = '/'
    weight = 1
  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    pageRef = '/about'
    weight = 2
  [[menu.main]]
    identifier = 'blog'
    name = 'Blog'
    url = '/blog/'
    pageRef = '/blog'
    weight = 3
  [[menu.main]]
    identifier = 'contact'
    name = 'Contact'
    url = '/contact/'
    weight = 4

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = true
    lineNumbersInTable = true
    noClasses = true
    style = 'monokai'
    tabWidth = 4

[outputs]
  home = ['HTML', 'RSS', 'JSON']
  page = ['HTML']
  section = ['HTML', 'RSS']

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

# Custom output format for generating the Sveltia CMS admin/config.yml at build time,
# so CMS-chrome fields (site_url, logout_redirect_url, logo, app_title) derive from this
# file instead of being hand-duplicated per site clone.
[mediaTypes."text/yaml"]
  suffixes = ["yml"]

[outputFormats.CMSConfig]
  mediaType = "text/yaml"
  isPlainText = true
  notAlternative = true
