# ── Scalars first — everything before the first array table stays at root scope ──

author = 'My Discombobulated Brain'
description = 'Compassionate mental health support, resources, and community for people and carers across the UK.'
keywords = ['mental health', 'charity', 'support', 'wellness', 'resources']
logo = 'images/my-discombob-logo.svg'
favicon = 'images/my-discombob-logo.svg'
email = 'contact@example.org'
phone = ''
contactFormat = 'list'
# ── Sub-tables ──────────────────────────────────────────────────────────────────

[hugo]
  version = '0.160.1'
  extended = true

[configs]
  searchSummaryLength = 250
  searchSummaryLengthMicro = 150

[style_rules]
  edges = 'round'
  expanded_nav = false
  primary_color = '#007649'
  secondary_color = '#EAB308'
  title_font = "'Exo', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
  body_font = "'Exo', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
  stacked_button_position = 'center'

[homepage_config]
  hero_format = 'overview'
  hero_image = 'hero-image.webp'
  upcomingEventsSection = true
  workingWithSection = true
  servicesSection = true
  awardsSection = true
  blogSection = false

[blog_settings]
  showReadingTime = true
  showShareButtons = true
  showDateUpdated = false

[contact_form]
  form_name = 'contact'
  success_url = ''

[footer]
  [footer.about_section]
    address = '123 Wellness Way, Mindful City, MC1 1CM'
    company = '12345678'
    charity = '87654321'
  [footer.support_section]
    email = 'support@example.org'
    phone = '0123 456 7890'

# ── Array tables last — TOML scope rule: no root-level scalars may follow ───────

